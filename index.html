<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia Turístico de Viana - MA</title>
    
    <!-- CSS do Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            overflow: hidden;
        }
        
        /* Tela de Boas-Vindas / Capa Responsiva com Background Image */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            /* Combina uma camada de tom azul escuro semitransparente com a imagem de fundo */
            background: linear-gradient(135deg, rgba(27, 77, 62, 0.85), rgba(15, 46, 36, 0.9)), 
                        url('imagens/background_viana.jpg') no-repeat center center;
            background-size: cover; /* Garante que a imagem se ajuste cobrindo toda a tela em qualquer dispositivo */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            transition: opacity 0.4s ease;
        }

        /* Container para Logomarca e Bandeira lado a lado */
        .logos-container {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .logos-container img {
            height: 70px;
            object-fit: contain;
            border-radius: 6px;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 4px;
        }

        #welcome-screen h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #ffd700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        #welcome-screen p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            max-width: 600px;
            color: #e0e0e0;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        .menu-options {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-option {
            background-color: #ffffff;
            color: #1b4d3e;
            border: none;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn-option:hover {
            background-color: #ffd700;
            color: #1b4d3e;
            transform: translateY(-3px);
        }

        /* Estrutura do Cabeçalho e Mapa */
        header {
            background-color: #1b4d3e;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        header h2 {
            font-size: 1.2rem;
        }
        .btn-voltar {
            background-color: #ffd700;
            color: #1b4d3e;
            border: none;
            padding: 6px 14px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-voltar:hover {
            background-color: #ffc107;
        }

        #map-container {
            position: relative;
            width: 100%;
            height: 100vh;
        }
        #map {
            width: 100%;
            height: calc(100vh - 50px);
        }

        /* Estilização Moderna das caixas de texto (popups) */
        .popup-card {
            max-width: 250px;
            text-align: center;
        }
        .popup-card h3 {
            margin-bottom: 6px;
            color: #1b4d3e;
            font-size: 15px;
        }
        .popup-card p {
            font-size: 12px;
            color: #444;
            margin-bottom: 8px;
            line-height: 1.4;
            text-align: justify;
        }
        .popup-card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .popup-card audio {
            width: 100%;
            height: 32px;
            margin-bottom: 8px;
        }
        .btn-route {
            display: inline-block;
            background-color: #1b4d3e;
            color: #ffffff;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background 0.2s;
            width: 100%;
        }
        .btn-route:hover {
            background-color: #2e7d62;
        }

        /* Responsividade para telas menores (celulares) */
        @media (max-width: 600px) {
            #welcome-screen h1 {
                font-size: 1.8rem;
            }
            #welcome-screen p {
                font-size: 0.95rem;
                padding: 0 10px;
            }
            .btn-option {
                padding: 12px 20px;
                font-size: 0.9rem;
            }
            .logos-container img {
                height: 55px;
            }
        }
    </style>
</head>
<body>

    <!-- Tela Inicial de Escolha com Background Responsivo -->
    <div id="welcome-screen">
        <div class="logos-container">
            <img src="imagens/logo_escola.png" alt="Logomarca da Escola">
            <img src="imagens/bandeira_viana.png" alt="Bandeira de Viana">
        </div>
        <h1>Descubra Viana - MA</h1>
        <p>Explore o patrimônio histórico, os encantos naturais e a beleza da nossa terra através de um guia digital interativo.</p>
        <div class="menu-options">
            <button class="btn-option" onclick="iniciarMapa('historico')">🏛️ Turismo Histórico</button>
            <button class="btn-option" onclick="iniciarMapa('natural')">🌿 Turismo Geográfico / Natural</button>
            <button class="btn-option" onclick="iniciarMapa('todos')">✨ Conhecer Tudo</button>
        </div>
    </div>

    <!-- Cabeçalho com o Botão de Retorno -->
    <header>
        <h2>Guia Interativo: Mapa Turístico de Viana - MA</h2>
        <button class="btn-voltar" onclick="voltarAoInicio()">🔄 Trocar Categoria</button>
    </header>

    <div id="map-container">
        <div id="map"></div>
    </div>

    <!-- JS do Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
    <script>
        // Função para exibir novamente a tela de boas-vindas
        function voltarAoInicio() {
            var welcomeScreen = document.getElementById('welcome-screen');
            welcomeScreen.style.display = 'flex';
            setTimeout(function() {
                welcomeScreen.style.opacity = '1';
            }, 10);
        }
    </script>
</body>
</html>
