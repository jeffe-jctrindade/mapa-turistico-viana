<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia Turístico de Viana - MA</title>
    
    <!-- CSS do Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            overflow: hidden;
        }
        
        /* Tela de Boas-Vindas / Capa Moderna */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1b4d3e, #0f2e24);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        #welcome-screen h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #ffd700;
        }
        #welcome-screen p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            max-width: 600px;
            color: #e0e0e0;
        }
        .menu-options {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-option {
            background-color: #ffffff;
            color: #1b4d3e;
            border: none;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn-option:hover {
            background-color: #ffd700;
            color: #1b4d3e;
            transform: translateY(-3px);
        }

        /* Estrutura do Mapa */
        header {
            background-color: #1b4d3e;
            color: #ffffff;
            text-align: center;
            padding: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        #map-container {
            position: relative;
            width: 100%;
            height: 100vh;
        }
        #map {
            width: 100%;
            height: calc(100vh - 50px);
        }

        /* Estilização Moderna das caixas de texto (popups) */
        .popup-card {
            max-width: 250px;
            text-align: center;
        }
        .popup-card h3 {
            margin-bottom: 6px;
            color: #1b4d3e;
            font-size: 15px;
        }
        .popup-card p {
            font-size: 12px;
            color: #444;
            margin-bottom: 8px;
            line-height: 1.4;
            text-align: justify;
        }
        .popup-card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .popup-card audio {
            width: 100%;
            height: 32px;
            margin-bottom: 8px;
        }
        .btn-route {
            display: inline-block;
            background-color: #1b4d3e;
            color: #ffffff;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background 0.2s;
            width: 100%;
        }
        .btn-route:hover {
            background-color: #2e7d62;
        }
    </style>
</head>
<body>

    <!-- Tela Inicial de Escolha -->
    <div id="welcome-screen">
        <h1>Descubra Viana - MA</h1>
        <p>Explore o patrimônio histórico, os encantos naturais e a beleza da nossa terra através de um guia digital interativo.</p>
        <div class="menu-options">
            <button class="btn-option" onclick="iniciarMapa('historico')">🏛️ Turismo Histórico</button>
            <button class="btn-option" onclick="iniciarMapa('natural')">🌿 Turismo Geográfico / Natural</button>
            <button class="btn-option" onclick="iniciarMapa('todos')">✨ Conhecer Tudo</button>
        </div>
    </div>

    <header>
        <h2>Guia Interativo: Mapa Turístico de Viana - MA</h2>
    </header>

    <div id="map-container">
        <div id="map"></div>
    </div>

    <!-- JS do Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
